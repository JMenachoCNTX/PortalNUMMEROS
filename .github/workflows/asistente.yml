name: Publicar asistente con IA (Cloudflare)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['asistente/**', '.github/workflows/asistente.yml']

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        id: sec
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          falta=""
          [ -z "$T" ] && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$A" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -z "$D" ] && falta="$falta DEEPSEEK_API_KEY"
          if [ -n "$falta" ]; then echo "::warning::Todavía faltan estos secretos en GitHub:$falta. El asistente se publicará cuando estén."; echo "listo=no" >> "$GITHUB_OUTPUT"; else echo "listo=si" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.sec.outputs.listo == 'si'
        with:
          node-version: 22

      - name: Publicar en Cloudflare
        if: steps.sec.outputs.listo == 'si'
        working-directory: asistente
        env:
          TOKEN_CRUDO: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA_CRUDA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAVE_CRUDA: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # Limpia los secretos por si se pegaron con texto de más (comandos, espacios, saltos de línea)
          T=$(printf '%s' "$TOKEN_CRUDO" | grep -oE 'Bearer[[:space:]]+[A-Za-z0-9_-]{30,}' | head -1 | awk '{print $2}')
          [ -z "$T" ] && T=$(printf '%s' "$TOKEN_CRUDO" | grep -oE '[A-Za-z0-9_-]{35,}' | head -1)
          export CLOUDFLARE_API_TOKEN="$T"
          CUENTA=$(printf '%s' "$CUENTA_CRUDA" | grep -oiE '[a-f0-9]{32}' | head -1 | tr 'A-F' 'a-f')
          if [ -z "$CUENTA" ]; then
            # Si el Account ID no vino bien, se busca con el token
            CUENTA=$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts | grep -oE '"id":"[a-f0-9]{32}"' | head -1 | grep -oE '[a-f0-9]{32}')
            [ -n "$CUENTA" ] && echo "::warning::El secreto CLOUDFLARE_ACCOUNT_ID no tenía un Account ID válido; se usó el de tu cuenta ($CUENTA)."
          fi
          export CLOUDFLARE_ACCOUNT_ID="$CUENTA"
          export DEEPSEEK_API_KEY=$(printf '%s' "$CLAVE_CRUDA" | grep -oE 'sk-[A-Za-z0-9]+' | head -1)
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::CLOUDFLARE_API_TOKEN no parece un token válido. Vuelve a copiarlo."; exit 1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "::error::No se encontró el Account ID. Revisa el secreto CLOUDFLARE_ACCOUNT_ID (32 letras y números) o los permisos del token."; exit 1; }
          [ -z "$DEEPSEEK_API_KEY" ] && { echo "::error::DEEPSEEK_API_KEY debe empezar con sk-"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$DEEPSEEK_API_KEY"
          avisar() { echo "::error::$1: $(tr '\n' ' ' < salida.txt | sed 's/\x1b\[[0-9;]*m//g' | tail -c 900)"; }
          npx --yes wrangler@3 deploy > salida.txt 2>&1 || { cat salida.txt; avisar "No se pudo publicar"; exit 1; }
          cat salida.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' salida.txt | head -1)
          printf '%s' "$DEEPSEEK_API_KEY" | npx --yes wrangler@3 secret put DEEPSEEK_API_KEY > salida.txt 2>&1 || { cat salida.txt; avisar "No se pudo guardar la clave de DeepSeek"; exit 1; }
          echo "::notice::Asistente publicado en $URL"
