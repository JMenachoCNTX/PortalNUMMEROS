name: Publicar asistente con IA (Cloudflare)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['asistente/**', '.github/workflows/asistente.yml']

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        id: sec
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          falta=""
          [ -z "$T" ] && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$A" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -z "$D" ] && falta="$falta DEEPSEEK_API_KEY"
          if [ -n "$falta" ]; then echo "::warning::Todavía faltan estos secretos en GitHub:$falta. El asistente se publicará cuando estén."; echo "listo=no" >> "$GITHUB_OUTPUT"; else echo "listo=si" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.sec.outputs.listo == 'si'
        with:
          node-version: 22

      - name: Publicar en Cloudflare
        if: steps.sec.outputs.listo == 'si'
        working-directory: asistente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          avisar() { echo "::error::$1: $(tr '\n' ' ' < salida.txt | sed 's/\x1b\[[0-9;]*m//g' | tail -c 900)"; }
          npx --yes wrangler@3 deploy > salida.txt 2>&1 || { cat salida.txt; avisar "No se pudo publicar"; exit 1; }
          cat salida.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' salida.txt | head -1)
          printf '%s' "$DEEPSEEK_API_KEY" | npx --yes wrangler@3 secret put DEEPSEEK_API_KEY > salida.txt 2>&1 || { cat salida.txt; avisar "No se pudo guardar la clave de DeepSeek"; exit 1; }
          echo "::notice::Asistente publicado en $URL"
