name: Sincronizar Google Sheets con Firebase

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos (GitHub a veces se demora unos minutos más)
  workflow_dispatch: {}      # botón "Run workflow" para sincronizar al instante
  push:
    branches: [main]
    paths: ['sync/**', 'firestore.rules']

permissions:
  contents: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sync/package-lock.json

      - name: Instalar
        working-directory: sync
        run: npm ci --no-audit --no-fund

      - name: Sincronizar
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sincronizar.mjs

      - name: Publicar imágenes nuevas de anuncios
        run: |
          git config user.name "Sincronización NUMMEROS"
          git config user.email "actions@users.noreply.github.com"
          git add anuncios
          if git diff --cached --quiet; then
            echo "Sin imágenes nuevas."
          else
            git commit -m "Anuncios: actualizar imágenes"
            git pull --rebase
            git push
          fi
